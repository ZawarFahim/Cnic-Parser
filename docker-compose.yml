services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/cnic_database
      - MONGO_DB_NAME=cnic_database
      - MONGO_COLLECTION_NAME=cnic_records
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/vision-key.json
      - MAX_IMAGE_SIZE_MB=10
    volumes:
      - ./backend/vision-key.json:/app/vision-key.json
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

  mongodb:
    image: mongo:latest
    container_name: cnic_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
